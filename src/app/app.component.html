
@if (!isLoginPage) {
  <div class="admin-container">

    <nav class="sidebar">

      <!-- LOGO -->
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>

        <div class="brand-text">
          <strong>Biblioteca</strong>
          <span>Comunitária</span>
        </div>
      </div>

      <!-- PERFIL DO USUÁRIO -->
      <div class="profile-card">

        <div class="profile-avatar"
             [class.avatar-admin]="nivelAcesso === 'ADMIN'"
             [class.avatar-operador]="nivelAcesso === 'OPERADOR'">
          {{ iniciaisUsuario }}
        </div>

        <div class="profile-info">
          <span class="profile-name">
            {{ nomeNivelAcesso }}
          </span>

          <span class="profile-email" [title]="emailUsuario">
            {{ emailUsuario }}
          </span>
        </div>

        <span class="profile-status" title="Sessão ativa"></span>

      </div>

      <!-- MENU -->
      <div class="menu-section">
        <span class="menu-label">MENU PRINCIPAL</span>

        <ul>

          <li>
            <a routerLink="/admin/dashboard"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               title="Dashboard">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="8" height="8" rx="2"/>
                <rect x="13" y="3" width="8" height="5" rx="2"/>
                <rect x="13" y="10" width="8" height="11" rx="2"/>
                <rect x="3" y="13" width="8" height="8" rx="2"/>
              </svg>

              <span>Dashboard</span>
            </a>
          </li>

          <li>
            <a routerLink="/admin/livros"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               title="Livros">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              </svg>

              <span>Livros</span>
            </a>
          </li>

          <li>
            <a routerLink="/admin/autores"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               title="Autores">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4Z"/>
              </svg>

              <span>Autores</span>
            </a>
          </li>

          <li>
            <a routerLink="/admin/usuarios"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               title="Usuários">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="10" cy="7" r="4"/>
                <path d="M20 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>

              <span>Usuários</span>
            </a>
          </li>

          <li>
            <a routerLink="/admin/emprestimos"
               routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: true }"
               title="Empréstimos">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="m17 2 4 4-4 4"/>
                <path d="M3 11V9a3 3 0 0 1 3-3h15"/>
                <path d="m7 22-4-4 4-4"/>
                <path d="M21 13v2a3 3 0 0 1-3 3H3"/>
              </svg>

              <span>Empréstimos</span>
            </a>
          </li>

        </ul>
      </div>

      <!-- RODAPÉ -->
      <div class="sidebar-footer">

        <div class="footer-divider"></div>

        <button class="logout-button" (click)="sair()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <path d="M16 17l5-5-5-5"/>
            <path d="M21 12H9"/>
          </svg>

          <span>Sair da conta</span>
        </button>

        <span class="sidebar-version">Biblioteca Comunitária</span>

      </div>

    </nav>

    <main>
      <router-outlet></router-outlet>
    </main>

  </div>

} @else {
  <router-outlet></router-outlet>
}
