<div class="livros-container">
  <h2>Gerenciamento de Livros</h2>

  <table border="1" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
    <thead>
      <tr style="background: #eee; text-align: left;">
        <th style="padding: 10px;">ID</th>
        <th style="padding: 10px;">Título</th>
        <th style="padding: 10px;">Autor</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let livro of livros">
        <td style="padding: 10px;">{{ livro.id }}</td>
        <td style="padding: 10px;">{{ livro.titulo }}</td>
        <td style="padding: 10px;">{{ livro.autor?.nome || 'N/A' }}</td>
      </tr>
      <tr *ngIf="livros.length === 0">
        <td colspan="3" style="padding: 10px; text-align: center;">Nenhum livro encontrado ou API desconectada.</td>
      </tr>
    </tbody>
  </table>
</div>
